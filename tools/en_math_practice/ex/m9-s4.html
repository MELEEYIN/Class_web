<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">设 z = u² + uv，其中 u = x + 2y，v = x − y，求 z<sub>x</sub>、z<sub>y</sub>，并求在点 (1,1) 处的值。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>先对中间变量求偏导：z<sub>u</sub> = 2u + v，z<sub>v</sub> = u；<br>按链式法则，每个中间变量贡献一项：z<sub>x</sub> = (2u + v)·1 + u·1 = 3u + v，z<sub>y</sub> = (2u + v)·2 + u·(−1) = 3u + 2v；<br>在 (1,1) 处 u = 3，v = 0，所以 <b>z<sub>x</sub> = 9，z<sub>y</sub> = 9</b>。</p><p class="ex-t">照树状图数项数：u、v 两条路径各一项；v<sub>y</sub> = −1 的负号最容易丢，丢了会算成 3u + 3v。</p></div></details></div>
