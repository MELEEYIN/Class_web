<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">求面密度 ρ = z 的上半球面 Σ：x² + y² + z² = a²（z ≥ 0）的质量。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>质量是标量，与侧无关，用第一类曲面积分：m = ∬<sub>Σ</sub>z dS；<br>球面上（z ≠ 0 时）dS = <span class="fr"><span class="n">a</span><span class="d">z</span></span>dxdy，投影域 D：x² + y² ≤ a²；<br>所以 m = ∬<sub>D</sub>z · <span class="fr"><span class="n">a</span><span class="d">z</span></span>dxdy = a ∬<sub>D</sub>dxdy = a · πa² = <b>πa³</b>。</p><p class="ex-t">求质量、面积、质心用第一类积分（无向），求流量、通量用第二类积分（有向）；用 dS = <span class="fr"><span class="n">a</span><span class="d">z</span></span>dxdy 时 z 在分母，遇到 z = 0 的点要分片处理。</p></div></details></div>
