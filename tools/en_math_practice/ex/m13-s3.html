<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">判断级数 <span class="fm">Σ<sub>n=1</sub><sup>∞</sup> <span class="fr"><span class="n">(−1)<sup>n</sup></span><span class="d">√n</span></span></span> 是绝对收敛、条件收敛，还是发散。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>先判绝对值级数：<span class="fm">Σ<sub>n=1</sub><sup>∞</sup> <span class="fr"><span class="n">1</span><span class="d">√n</span></span></span> 是 p = <span class="fr"><span class="n">1</span><span class="d">2</span></span> ≤ 1 的 p-级数，发散，所以不绝对收敛；<br>再判原级数：u<sub>n</sub> = <span class="fr"><span class="n">1</span><span class="d">√n</span></span> 单调递减且趋于 0，由莱布尼茨判别法，交错级数收敛；<br>所以原级数 <b>条件收敛</b>。</p><p class="ex-t">顺序不能反：先算绝对值级数（用正项级数那一套），绝对值发散后再回头用莱布尼茨。如果绝对值级数本身就收敛，直接答绝对收敛，不必再看交错。</p></div></details></div>
