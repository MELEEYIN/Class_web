<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">设级数 <span class="fm">Σ<sub>n=1</sub><sup>∞</sup> <span class="fr"><span class="n">1</span><span class="d">n(n+1)</span></span></span>，求它的前 n 项部分和 S<sub>n</sub>，并判断该级数是否收敛；若收敛，写出级数的和。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>把通项拆成两项之差：<span class="fr"><span class="n">1</span><span class="d">n(n+1)</span></span> = <span class="fr"><span class="n">1</span><span class="d">n</span></span> − <span class="fr"><span class="n">1</span><span class="d">n+1</span></span>，累加时中间项两两抵消；<br>得 S<sub>n</sub> = 1 − <span class="fr"><span class="n">1</span><span class="d">n+1</span></span>；<br>取极限 <span class="lm">lim<span class="s">n→∞</span></span> S<sub>n</sub> = 1，部分和数列有极限；<br>所以级数收敛，它的和是 <b>1</b>。</p><p class="ex-t">判敛的定义就是「部分和数列有极限」：先求出 S<sub>n</sub> 的封闭形式，再取极限。通项 u<sub>n</sub> → 0 只是收敛的必要条件，不能反过来当收敛的证明。</p></div></details></div>
