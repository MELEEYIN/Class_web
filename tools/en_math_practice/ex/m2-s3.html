<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">设 y = x<sup>2</sup>e<sup>x</sup>，求 y<sup>(n)</sup>（n 为正整数）。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>用莱布尼茨公式，取 u = x<sup>2</sup>，v = e<sup>x</sup>；<br>因为 u 的三阶以上导数全为 0，展开式只剩三项：y<sup>(n)</sup> = C(n,0)x<sup>2</sup>e<sup>x</sup> + C(n,1)(2x)e<sup>x</sup> + C(n,2)·2·e<sup>x</sup>；<br>整理得 <b>y<sup>(n)</sup> = e<sup>x</sup>[x<sup>2</sup> + 2nx + n(n − 1)]</b>。</p><p class="ex-t">多项式因子只算到二阶导就停；第三项系数 C(n,2)·2 = n(n − 1)，用 n = 1、2 回代可以自检。</p></div></details></div>
