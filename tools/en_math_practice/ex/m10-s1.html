<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">设 D = {(x, y) | x<sup>2</sup> + y<sup>2</sup> ≤ 4}，计算 <span class="fm">∬<sub>D</sub>(x<sup>3</sup> + sin y + 3)dxdy</span>。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>D 关于 y 轴对称，而 x<sup>3</sup> 关于 x 为奇函数，故 <span class="fm">∬<sub>D</sub>x<sup>3</sup>dxdy = 0</span>；<br>D 关于 x 轴对称，而 sin y 关于 y 为奇函数，故 <span class="fm">∬<sub>D</sub>sin y dxdy = 0</span>；<br>只剩常数项，<span class="fm">∬<sub>D</sub>3dxdy = 3S<sub>D</sub> = 3 · 4π = 12π</span>。<br>所以结果是 <b>12π</b>。</p><p class="ex-t">先按线性拆成三项，再逐项看奇偶性：两个方向要分别判断，x<sup>3</sup> 看 x 的奇偶、sin y 看 y 的奇偶，最后只剩区域面积乘以常数。</p></div></details></div>
