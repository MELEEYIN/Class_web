<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">求 <span class="lm">lim<span class="s">x→1</span></span> ln<span class="fr"><span class="n">x² − 1</span><span class="d">x − 1</span></span>。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>先把内层的极限算出来：x → 1 时内层是 <span class="fr"><span class="n">0</span><span class="d">0</span></span>，约分得 <span class="fr"><span class="n">x² − 1</span><span class="d">x − 1</span></span> = x + 1 → 2；<br>ln u 在 u = 2 处连续，所以极限可以搬进函数里：<br>原式 = ln 2，即 <b>ln 2</b>。</p><p class="ex-t">「极限搬进函数」的前提是外层在极限值处连续；内层在 x = 1 没有定义并不妨碍，只要内层的极限存在就能搬。若外层不连续（如分段点）就不能搬。</p></div></details></div>
