<div class="ex"><div class="ex-h"><span class="ex-n">练 1</span>先自己做，再展开答案</div><p class="ex-q">讨论二重极限 <span class="lm">lim<span class="s">(x,y)→(0,0)</span></span> <span class="fr"><span class="n">xy</span><span class="d">x² + y²</span></span> 是否存在。</p><details class="ex-a"><summary>展开答案与解析</summary><div class="ex-a-body"><p><b>解　</b>先让点沿直线 y = kx 趋于原点，此时 f(x, kx) = <span class="fr"><span class="n">kx²</span><span class="d">(1 + k²)x²</span></span> = <span class="fr"><span class="n">k</span><span class="d">1 + k²</span></span>，极限值随 k 改变；<br>取 k = 1 得极限 <span class="fr"><span class="n">1</span><span class="d">2</span></span>，取 k = 0（沿 x 轴）得极限 0，两条路径的结果不同；<br>所以这个二重极限<b>不存在</b>。</p><p class="ex-t">二重极限要求点以任意方式趋于定点时结果都相同，找到两条路径不同就能否定；但只验证几条路径相同，不能证明极限存在。</p></div></details></div>
