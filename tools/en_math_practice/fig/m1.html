<text x="86" y="150" font-family="system-ui,sans-serif" font-size="12" fill="#8fa3bd">故 y = x + 1 是斜渐近线</text>
</svg><figcaption><b>图 1-2</b> 斜渐近线：f(x) = (x² + 1)/(x − 1) 拆成 x + 1 + 2/(x − 1)。x → ±∞ 时那条尾巴 2/(x − 1) → 0，曲线与直线 y = x + 1 的竖直距离（蓝色阴影）越往右越薄，所以直线可以当曲线的替身；反过来 x → 1 时尾巴爆炸，曲线被拉向无穷，于是 x = 1 是垂直渐近线。求渐近线就是「先拆，再看每一条尾巴的归宿」。</figcaption></figure>
