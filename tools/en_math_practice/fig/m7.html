<p class="fig-intro">先看两张图建立直觉：第一张是「认类型」的流程——微分方程这一章的题几乎都是先分类、再套解法，算之前先知道自己面对的是哪一类；第二张画的是 y′ + y = x 的一族积分曲线，它们起点不同，但 x 增大后都被同一个特解 y = x − 1 拉过去，这就是「通解 = 齐次通解 + 一个特解」的几何样子。</p>
