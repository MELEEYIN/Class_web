<p class="fig-intro">先看两张图建立直觉：第一张是<b>导数</b>——让割线的第二个点滑向定点，割线斜率的极限就是切线斜率；第二张是<b>微分</b>——用切线上的一小段 dy 去近似函数真正的增量 Δy。两件事其实是同一件事：曲线在一点附近，可以用一条直线「贴住」。</p>
