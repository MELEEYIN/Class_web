<p class="fig-intro">先看两张图建立直觉：定积分是「把区间切成小条、把面积加起来、再让条宽趋于 0」的结果；而变上限积分 Φ(x) 是「从 a 一路扫到 x 扫出来的那块面积」，它每多扫一点，面积只增加约 f(x)Δx —— 这正是 Φ′(x) = f(x) 的几何来源。</p>

<figure class="fig"><svg class="figsvg" viewBox="0 0 640 300" role="img" aria-label="变上限积分是扫出来的面积" font-family="system-ui,sans-serif" font-size="12" fill="#8fa3bd"><path d="M60 240 H620" stroke="#9aa8bd" stroke-width="1.6"/><path d="M90 258 V44" stroke="#9aa8bd" stroke-width="1.6"/><path d="M140 240 L140 205 L200 176 L260 153 L320 136 L380 122 L420 114 L420 240 Z" fill="rgba(91,141,239,.14)"/><path d="M140 205 L200 176 L260 153 L320 136 L380 122 L420 114 L470 104 L520 96" fill="none" stroke="#5b8def" stroke-width="2"/><path d="M420 240 L420 114 L470 104 L470 240 Z" fill="rgba(224,160,60,.18)"/><path d="M420 114 V240" stroke="#e0a03c" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M470 104 V240" stroke="#9aa8bd" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M90 114 H420" stroke="#e0a03c" stroke-width="1.6" stroke-dasharray="3 5"/><circle cx="420" cy="114" r="3" fill="#e0a03c"/><text x="72" y="42">y</text><text x="556" y="258">x → +∞</text><text x="78" y="258">O</text><text x="135" y="258">a</text><text x="412" y="258">x</text><text x="450" y="258">x + Δx</text><text x="96" y="109" fill="#c08a2e" font-size="11.5">f(x)</text><text x="240" y="208" fill="#5b8def">Φ(x)</text><text x="484" y="80" fill="#5b8def">y = f(x)</text><text x="434" y="230" fill="#c08a2e" font-size="11.5">Δx</text><text x="120" y="286" font-size="11.5">x 每向右挪 Δx，Φ 只增加约 f(x)Δx，两边除以 Δx 再令 Δx → 0 就是 Φ′(x) = f(x)</text></svg><figcaption><b>图 5-2</b>变上限积分 Φ(x) = ∫<sub>a</sub><sup>x</sup> f(t) dt 是「扫」出来的面积：横向多扫 Δx，纵向高度几乎恒为 f(x)，所以面积增量 ≈ f(x)Δx，这就是变上限积分求导公式。</figcaption></figure>
