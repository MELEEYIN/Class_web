<p class="fig-intro">先看两张图建立直觉：<b>图 3-1</b> 把「存在 ξ」还原成一个几何事实——两端等高的曲线上，必定有一点的切线是水平的；<b>图 3-2</b> 说明二阶导数的符号怎样决定曲线弯向哪边，以及拐点处切线会「穿过」曲线。第一节和第四节的定义，看图比背文字快。</p>
