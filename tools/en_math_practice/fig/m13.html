<p class="fig-intro">先看两张图建立直觉：级数判敛不是「背一堆判别法」，而是一条固定的检查顺序——顺序对了，工具自然知道选哪个；而 p-级数为什么偏偏在 p = 1 处分界，把每一项看成一个矩形、用面积（积分）一比就明白了。</p>
