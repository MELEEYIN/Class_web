<p class="fig-intro">这一章全是「看得见」的几何：先看两张图建立直觉——第一张把叉积与线面角的几何意义摆在一起，第二张演示旋转曲面是怎么由一条母线「转」出来的。把图形和公式对上号，判别曲面类型、算线面角就不会再靠背。</p>
