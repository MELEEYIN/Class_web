<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACM 算法站 · 学习手册 / 计划 / 60 节教程</title>
<meta name="description" content="ACM 算法学习站：学习手册 122 张算法卡片、按 12 周推进的学习计划 125 张卡片、日常开发基本功，以及 60 节重构版算竞教程（含三场赛事题解）。全屏侧栏布局，支持站内检索与逐节进度。">
<meta name="theme-color" content="#060d1a">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d8dff'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='30' font-weight='700' fill='%23041020' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<script src="../js/boot.js"></script>
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/content.css">
</head>
<body>

<div class="app">
  <!-- ============================ 侧栏 ============================ -->
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#/">
        <span class="brand-mark">A</span>
        <span class="brand-txt">
          <b>ACM 算法站</b>
          <small>手册 · 计划 · 60 节教程</small>
        </span>
      </a>
      <button class="side-x" id="sideX" type="button" aria-label="收起侧栏">✕</button>
    </div>

    <div class="side-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="sideSearch" type="search" placeholder="搜索算法、章节、题号…" autocomplete="off" aria-label="搜索">
      <kbd>Ctrl K</kbd>
    </div>

    <nav class="side-nav" id="nav" aria-label="站点目录"></nav>

    <div class="side-foot">
      <div class="pg-t"><span>教程进度</span><b id="pgNum">0 / 60</b></div>
      <div class="pg-bar"><i id="pgBar"></i></div>
      <div class="side-tools">
        <button class="mini-btn" id="themeBtn" type="button"></button>
        <a class="mini-btn push" href="../index.html" title="回到校园主页">校园主页</a>
      </div>
    </div>
  </aside>

  <!-- ============================ 主区 ============================ -->
  <div class="main">
    <header class="top" id="top">
      <button class="burger" type="button" aria-label="打开目录">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-r">
        <button class="top-btn" id="searchBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <span class="tl">搜索</span>
        </button>
        <a class="top-btn" href="practice.html" title="例题练习场">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
          <span class="tl">题单</span>
        </a>
      </div>
    </header>

    <button class="to-top" id="toTop" type="button" aria-label="回到顶部" title="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>

    <button class="to-top" id="toTop" type="button" aria-label="回到顶部" title="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>

    <div class="scroll" id="scroll">
      <div class="readbar"><i id="readBar"></i></div>
      <div class="view">
        <div class="stage">
          <article class="doc" id="doc"></article>
          <nav class="pager" id="pager" aria-label="翻页"></nav>
        </div>
        <aside class="rail" id="rail">
          <div class="rail-in">
            <div class="rail-t">本页目录</div>
            <nav id="tocList"></nav>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>

<div class="mask"></div>

<!-- ============================ 搜索浮层 ============================ -->
<div class="sov" id="sov" role="dialog" aria-modal="true" aria-label="站内搜索">
  <div class="sov-box">
    <div class="sov-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="sovInput" type="search" placeholder="搜索 122 张算法卡片 / 60 节教程 / 计划章节…" autocomplete="off">
      <kbd>ESC</kbd>
      <button class="mini-btn" id="sovClose" type="button">关闭</button>
    </div>
    <div class="sov-list" id="sovList"></div>
    <div class="sov-f">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
      <span style="margin-left:auto">标题命中优先</span>
    </div>
  </div>
</div>

<!-- ============================ 首页模板 ============================ -->
<template id="tpl-home">
  <header class="hero">
    <div class="eyebrow">Campus · ACM 算法子站</div>
    <h1>把算法学成<span>能默写的手感</span></h1>
    <p>手册负责「查」，计划负责「按周推进」，教程负责「从零讲清」，日常开发负责「别在细节上翻车」。四块内容共用一套目录、一套检索、一套进度。</p>
    <div class="hero-stats">
      <div><b data-hs="total">0</b><span>内容页</span></div>
      <div><b>122</b><span>算法卡片</span></div>
      <div><b data-hs="lessons">60</b><span>教程小节</span></div>
      <div><b data-hs="done">0</b><span>已学（节）</span></div>
    </div>
  </header>

  <div class="sec-t"><h2>从哪开始</h2><em>三条路线，挑一条走完</em></div>
  <div class="paths">
    <a class="path" href="#/course/1">
      <span class="pk">零基础 / 大一上</span>
      <b>从第 1 节顺读</b>
      <p>输入输出 → 循环 → 数组 → 函数 → 排序 → 贪心 → 搜索 → DP → 图论。每节 45 分钟，含例题、新函数拆解与挑战题。</p>
      <span class="go">打开第 1 节 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="path" href="#/plan/s0">
      <span class="pk">有语法基础 / 想过普及−</span>
      <b>按 12 周计划推进</b>
      <p>13 章按周推进：先补 C++ 语法与上机基本功，再走入门十动作 → 数据结构 → DP → 图论 → 数学 → 字符串，最后接训练节奏与考场策略。</p>
      <span class="go">看学习计划 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="path" href="#/hb/entry">
      <span class="pk">做题卡住 / 当字典查</span>
      <b>翻学习手册</b>
      <p>122 张卡片：一句话本质 + 可默写的模板 + 分级题单。入门 10 项思维动作，基础与进阶按数据结构 / DP / 图论 / 数学分类。</p>
      <span class="go">进入手册 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </div>

  <div class="sec-t"><h2>四个模块</h2><em>侧栏可直达任意小节</em></div>
  <div class="mods">
    <a class="mod-c" href="#/hb/entry">
      <div class="mt"><b>学习手册</b><em>7 章 · 122 张</em></div>
      <div class="md">122 张算法卡片，按入门 / 基础 / 进阶三层，数据结构、DP、图论、数学几何博弈四个方向。每张卡片给本质、复杂度、模板、题单。</div>
      <div class="mrow"><span>入门 10</span><span>基础 36</span><span>进阶 76</span><span>10 篇详解</span><span>勘误</span></div>
    </a>
    <a class="mod-c" href="#/course">
      <div class="mt"><b>算竞教程</b><em>60 节</em></div>
      <div class="md">十二组、每组五节，从 cin/cout 一直讲到莫队与凸包。每节都有「评测机制 → 例题 → 新函数拆解 → 逐行说明 → 思考点 → 挑战题」。</div>
      <div class="mrow"><span>12 组</span><span>入门 → 提高+</span><span>回顾 9 节</span><span>模拟赛 2 场</span></div>
      <div class="mbar"><i data-hs="bar" style="width:0%"></i></div>
    </a>
    <a class="mod-c" href="#/plan/s0">
      <div class="mt"><b>学习计划</b><em>13 章 · 125 张</em></div>
      <div class="md">按周排的课程表：C++ 语法补课、上机基本功、入门十动作、六类数据结构、DP、图论、数学、字符串，外加 12 周训练表、考场策略与速查表。</div>
      <div class="mrow"><span>12 周</span><span>每周题单</span><span>速查表</span><span>考场策略</span></div>
    </a>
    <a class="mod-c" href="#/dev/start">
      <div class="mt"><b>日常开发</b><em>8 章</em></div>
      <div class="md">复杂度分析、脚手架与快读快写、对拍、常见错误字典、离散化、术语词典。都是「不写会一直扣分」的基本功。</div>
      <div class="mrow"><span>复杂度</span><span>对拍</span><span>离散化</span><span>词典</span></div>
    </a>
  </div>

  <div class="sec-t"><h2>最近浏览</h2><em>存在本机，不上传</em></div>
  <div class="cont" id="recent"><div class="sov-e" style="padding:16px">还没有浏览记录。</div></div>

  <div class="sec-t"><h2>速查入口</h2><em>做题时最常翻的几页</em></div>
  <div class="cont">
    <a href="#/dev/c1"><span class="no">01</span><span class="tt">复杂度分析：一分钟算出「能不能过」</span><span class="lvv">日常开发</span></a>
    <a href="#/dev/c2"><span class="no">02</span><span class="tt">竞赛代码脚手架：快读、快写与常用宏</span><span class="lvv">日常开发</span></a>
    <a href="#/plan/s12"><span class="no">03</span><span class="tt">速查表：二分模板、背包四兄弟、图论五行</span><span class="lvv">学习计划</span></a>
    <a href="#/dev/c4"><span class="no">04</span><span class="tt">常见错误字典：看到结果就知道错在哪</span><span class="lvv">日常开发</span></a>
    <a href="#/dev/glossary"><span class="no">05</span><span class="tt">术语词典：看不懂的词来这里查</span><span class="lvv">日常开发</span></a>
    <a href="practice.html"><span class="no">→</span><span class="tt">例题练习场（按知识点跳洛谷题）</span><span class="lvv">外部页</span></a>
  </div>

  <div class="home-foot">
    <span>内容来源：校园主页 ACM 子站 · 学习手册 / 学习计划 / 日常开发</span>
    <span>教程与题解：Learning Group · 算竞教程（60 节）</span>
  </div>
</template>
