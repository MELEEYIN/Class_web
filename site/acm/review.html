<link rel="stylesheet" href="./acm.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:rgb(var(--bg-rgb));color:var(--text);
  font:14.5px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.bg,.bg-tint,.bg-dim{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg{inset:-3%;background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity .35s,filter .35s}
.bg-tint{background:linear-gradient(180deg,rgb(var(--bg-rgb) / .34),rgb(var(--bg-rgb) / .72) 48%,rgb(var(--bg-rgb) / .9))}
body.has-bg .bg-tint{display:none}
.bg-dim{transition:background .25s}
.bg[data-p="aurora"]{background-image:
  radial-gradient(58% 52% at 16% 6%, rgba(77,141,255,.55), transparent 62%),
  radial-gradient(46% 44% at 88% 14%, rgba(45,212,191,.34), transparent 64%),
  radial-gradient(72% 60% at 48% 104%, rgba(139,124,246,.42), transparent 62%)}
.bg[data-p="grid"]{background-image:
  linear-gradient(rgba(120,165,230,.16) 1px, transparent 1px),
  linear-gradient(90deg, rgba(120,165,230,.16) 1px, transparent 1px);
  background-size:44px 44px,44px 44px;background-repeat:repeat}
.bg[data-p="dots"]{background-image:radial-gradient(rgba(120,165,230,.35) 1.5px, transparent 1.6px);
  background-size:26px 26px;background-repeat:repeat}
.bg[data-p="star"]{background-image:
  radial-gradient(1.8px 1.8px at 22% 28%, rgba(160,200,255,.9), transparent),
  radial-gradient(1.4px 1.4px at 68% 14%, rgba(255,255,255,.8), transparent),
  radial-gradient(1.6px 1.6px at 44% 66%, rgba(255,255,255,.65), transparent),
  radial-gradient(1.2px 1.2px at 86% 54%, rgba(140,190,255,.9), transparent),
  radial-gradient(1.5px 1.5px at 12% 82%, rgba(255,255,255,.6), transparent),
  radial-gradient(1.1px 1.1px at 56% 92%, rgba(180,210,255,.8), transparent);
  background-size:420px 420px;background-repeat:repeat}
.bg[data-p="wave"]{background-image:
  repeating-linear-gradient(135deg, rgba(77,141,255,.12) 0 2px, transparent 2px 16px),
  radial-gradient(80% 60% at 50% 0%, rgba(77,141,255,.22), transparent 72%)}
.acm-nav,.top,.rv-layout{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none}
code,pre{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgb(var(--accent-rgb) / .34);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::selection{background:rgb(var(--accent-rgb) / .35)}

/* ---------- 顶部标题（在主列里，和侧栏并排） ---------- */
.rv-hero{padding:2px 0 20px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.rv-hero h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em}
.rv-hero .sub{color:var(--text-2);font-size:13.5px;margin:8px 0 0;max-width:900px}
.rv-kpi{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap}
.rv-kpi div{display:flex;flex-direction:column;gap:2px}
.rv-kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.rv-kpi span{font-size:11.5px;color:var(--text-3);letter-spacing:.04em}

/* ---------- 两栏布局：侧栏贴左，占满整高 ---------- */
.rv-layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start;
  max-width:none;margin:0;padding:0}
.rv-side{position:sticky;top:var(--acm-nav-h);height:calc(100vh - var(--acm-nav-h));
  overflow:auto;padding:16px 12px 40px;border-right:1px solid var(--line);
  background:rgb(var(--panel-rgb) / .46);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.rv-side-in{padding:0}
.rv-search{display:flex;align-items:center;gap:7px;background:rgb(var(--bg-rgb) / .5);
  border:1px solid var(--line);border-radius:9px;padding:0 10px;height:32px;margin:0 2px 12px}
.rv-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:12.8px;outline:none}
.rv-search input::placeholder{color:var(--text-3)}
.rv-search svg{width:14px;height:14px;color:var(--text-3);flex:none}
.rv-side-t{font-size:11px;color:var(--text-3);letter-spacing:.1em;padding:0 8px;margin:14px 0 5px}
.rv-side-t:first-of-type{margin-top:2px}
.rv-cats,.rv-topics{display:flex;flex-direction:column;gap:1px}
.rv-cats button,.rv-topics a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;
  padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1.5}
.rv-cats button:hover,.rv-topics a:hover{background:rgb(var(--accent-rgb) / .1);color:var(--text)}
.rv-cats button.on{background:rgb(var(--accent-rgb) / .17);color:var(--text);font-weight:600}
.rv-cats .dot,.rv-cat-h .dot{width:7px;height:7px;border-radius:50%;flex:none}
.rv-cats .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-cats .ct,.rv-topics .ct{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.rv-topics a{font-size:12.6px;padding:5px 8px;border-left:2px solid transparent;border-radius:0 8px 8px 0}
.rv-topics a.on{border-left-color:rgb(var(--accent-rgb));background:rgb(var(--accent-rgb) / .1);color:var(--text)}
.rv-topics .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 主列 ---------- */
.rv-main{min-width:0;padding:26px 34px 90px}
.rv-inner{max-width:1460px;margin:0 auto}
.rv-tip{margin:0 0 18px;padding:11px 15px;border-radius:11px;font-size:13px;color:var(--text-2);

.rv-tip b{color:var(--text)}

.rv-cat{margin:0 0 32px}
.rv-cat-h{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.rv-cat-h h2{margin:0;font-size:18.5px;font-weight:700;letter-spacing:-.01em}
.rv-cat-h .dot{width:9px;height:9px;transform:translateY(-1px)}
.rv-cat-h .cnt{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.rv-cat-h .desc{margin-left:auto;font-size:12.5px;color:var(--text-3);text-align:right}
.d-keng{background:rgb(var(--danger-rgb))}
.d-zhishi{background:rgb(var(--accent-rgb))}
.d-silu{background:rgb(var(--vio-rgb))}

.rv-topic-h{margin:24px 0 12px;padding-left:11px;border-left:3px solid rgb(var(--accent-rgb) / .45);scroll-margin-top:24px}
.rv-topic-h h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:baseline;gap:8px}
.rv-topic-h .cnt{font-size:11.5px;color:var(--text-3);font-weight:400}

.rv-card{background:rgb(var(--panel-rgb) / var(--panel-a));border:1px solid var(--line);
  border-radius:14px;padding:17px 20px;margin:0 0 13px;transition:border-color .18s}
.rv-card:hover{border-color:rgb(var(--accent-rgb) / .3)}
.rv-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.rv-id{font-family:Consolas,monospace;font-size:11.5px;font-weight:700;color:var(--accent);
  background:rgb(var(--accent-rgb) / .13);border:1px solid rgb(var(--accent-rgb) / .28);
  padding:1px 7px;border-radius:6px;letter-spacing:.03em}
.rv-h h4{margin:0;font-size:16.5px;font-weight:650;flex:1 1 240px;line-height:1.5}
.rv-pid{font-family:Consolas,monospace;font-size:11.5px;color:var(--text-3);white-space:nowrap}

.rv-body p{margin:0 0 10px}
.rv-body pre{margin:10px 0;background:var(--code-bg);border:1px solid var(--code-line);border-radius:10px;
  padding:11px 13px;overflow:auto;font-size:12.8px;line-height:1.68;color:var(--code-text)}
.rv-body code{background:rgb(var(--accent-rgb) / .12);padding:1px 5px;border-radius:5px;font-size:12.8px}
.rv-body pre code{background:none;padding:0;font-size:inherit}
.rv-body b{color:var(--text);font-weight:650}
.rv-body table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
.rv-body th,.rv-body td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.rv-body th{background:rgb(var(--accent-rgb) / .07);font-weight:600}
.rv-label{display:inline-block;font-size:11.5px;color:var(--text-3);letter-spacing:.06em;margin:2px 0}

.rv-fold{margin-top:2px;border-top:1px dashed var(--line);padding-top:2px}
.rv-fold summary{cursor:pointer;list-style:none;font-size:13px;color:var(--accent);
  padding:8px 0 4px;user-select:none;display:flex;align-items:center;gap:7px}
.rv-fold summary::-webkit-details-marker{display:none}
.rv-fold summary::before{content:"▶";font-size:9px;transition:transform .18s;display:inline-block}
.rv-fold[open] summary::before{transform:rotate(90deg)}
.rv-fold summary:hover{text-decoration:underline}

.rv-empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.rv-empty b{display:block;font-size:16px;color:var(--text-2);margin-bottom:6px}

/* ---------- 窄屏：侧栏收成横条 ---------- */
@media(max-width:980px){
  .rv-layout{grid-template-columns:1fr;padding:0}
  .rv-side{position:static;height:auto;overflow:visible;

  .rv-cats{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .rv-cats button{white-space:nowrap;padding:5px 12px;border:1px solid var(--line);border-radius:20px;font-size:12.8px}
  .rv-cats button.on{border-color:rgb(var(--accent-rgb) / .55)}
  .rv-cats .dot{display:none}
  .rv-side-t.topic,.rv-topics{display:none}
  .rv-main{padding:16px 16px 70px}
  .rv-hero{padding:2px 0 16px;margin-bottom:14px}
  .rv-hero h1{font-size:20px}.rv-kpi{gap:20px}.rv-kpi b{font-size:19px}
  .rv-card{padding:15px 15px;border-radius:13px}
  .rv-h h4{font-size:15.5px}
  .rv-cat-h .desc{display:none}
}
</style>

<script>
(function(){
'use strict';
var CARDS = window.__REVIEW_CARDS || [];
var ORDER = ['坑点','知识点','思路'];
var DESC  = {
  '坑点':'都真的错过一次，改法能直接抄',
  '知识点':'API、类型、边界的硬知识',
  '思路':'这类题的通用套路，忘了就从零推'
};
var DOT = {'坑点':'d-keng','知识点':'d-zhishi','思路':'d-silu'};

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(t){
  if(!t || !t.trim()) return '';
  return t.split(/\n{2,}/).map(function(p){
    p = p.trim(); if(!p) return '';
    if(/^\|/.test(p)) return table(p);
    var h = esc(p)
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\n/g,'<br>');
    return '<p>'+h+'</p>';
  }).join('');
}
function table(p){
  var rows = p.split('\n').filter(function(l){ return l.trim().charAt(0) === '|'; });
  if(rows.length < 2) return '<p>'+esc(p)+'</p>';
  var out = '<table>';
  rows.forEach(function(r, i){
    if(/^\|[\s:|-]+\|$/.test(r.trim())) return;          // 分隔行
    var cells = r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
    out += '<tr>' + cells.map(function(c){
      var txt = esc(c.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
      return (i === 0 ? '<th>'+txt+'</th>' : '<td>'+txt+'</td>');
    }).join('') + '</tr>';
  });
  return out + '</table>';
}
function md(t){
  if(!t) return '';
  var re = /```[a-zA-Z]*\n([\s\S]*?)```/g, out = '', last = 0, m;
  while((m = re.exec(t))){
    out += inline(t.slice(last, m.index));
    out += '<pre><code>'+esc(m[1].replace(/\n$/,''))+'</code></pre>';
    last = re.lastIndex;
  }
  return out + inline(t.slice(last));
}

var q = '', cat = '';

function match(c){
  if(cat && c.type !== cat) return false;
  if(q){
    var hay = [c.id,c.title,c.pid,c.type,c.topic,c.symptom,c.cause,c.fix].join(' ').toLowerCase();
    if(hay.indexOf(q.toLowerCase()) < 0) return false;
  }
  return true;
}

function cardHTML(c){
  return ''
  + '<article class="rv-card" data-id="'+c.id+'">'
  +   '<div class="rv-h">'
  +     '<span class="rv-id">'+c.id+'</span>'
  +     '<h4>'+esc(c.title)+'</h4>'
  +     (c.pid ? '<span class="rv-pid">'+esc(c.pid)+'</span>' : '')
  +   '</div>'
  +   '<div class="rv-body"><span class="rv-label">现象</span>'+md(c.symptom)+'</div>'
  +   '<details class="rv-fold"><summary>想好了，点开对答案</summary>'
  +     '<div class="rv-body">'
  +       (c.cause ? '<span class="rv-label">原因</span>'+md(c.cause) : '')
  +       (c.fix   ? '<span class="rv-label">修法</span>'+md(c.fix)   : '')
  +     '</div>'
  +   '</details>'
  + '</article>';
}

function byDate(a,b){
  if(a.date !== b.date) return a.date < b.date ? 1 : -1;
  return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
}

/* 把过滤后的卡按 大类 → 小类 排好，返回 [{cat, topics:[{name, cards}]}] */
function build(){
  var pool = CARDS.filter(match), out = [];
  ORDER.forEach(function(t){
    var arr = pool.filter(function(c){ return c.type === t; });
    if(!arr.length) return;
    var names = [], map = {};
    arr.forEach(function(c){
      var k = c.topic || '其他';
      if(!map[k]){ map[k] = []; names.push(k); }
      map[k].push(c);
    });
    names.sort(function(a,b){
      if(map[a].length !== map[b].length) return map[b].length - map[a].length;
      return a.localeCompare(b,'zh');
    });
    out.push({cat:t, cards:arr, topics:names.map(function(k){ return {name:k, cards:map[k].slice().sort(byDate)}; })});
  });
  return out;
}

var NUM = {};   // 锚点编号

function render(){
  var groups = build();
  var i = 0;

  var html = groups.map(function(g){
    var topics = g.topics.map(function(t){
      var id = 't' + (i++);
      return '<div class="rv-topic-h" id="'+id+'"><h3>'+esc(t.name)+'<span class="cnt">'+t.cards.length+' 张</span></h3></div>'
           + t.cards.map(cardHTML).join('');
    }).join('');
    return '<section class="rv-cat">'
      + '<div class="rv-cat-h"><i class="dot '+(DOT[g.cat]||'d-keng')+'"></i>'
      +   '<h2>'+g.cat+'</h2><span class="cnt">'+g.cards.length+' 张 · '+g.topics.length+' 个小类</span>'
      +   '<span class="desc">'+(DESC[g.cat]||'')+'</span></div>'
      + topics
      + '</section>';
  }).join('');

  document.getElementById('list').innerHTML = html ||
    '<div class="rv-empty"><b>没有匹配的卡</b>换个关键词或大类试试。</div>';

  buildNav(groups);

  var nTopic = groups.reduce(function(s,g){ return s + g.topics.length; }, 0);
  document.getElementById('tip').innerHTML = groups.length
    ? '共 <b>'+CARDS.length+'</b> 张卡，<b>'+groups.length+'</b> 个大类、<b>'+nTopic+'</b> 个小类。'
      + '做题卡住先按小类翻；平时只读「现象」。'
    : '当前筛选条件下没有卡片。';

  document.getElementById('kAll').textContent  = CARDS.length;
  document.getElementById('kKeng').textContent = CARDS.filter(function(c){ return c.type === '坑点'; }).length;
  document.getElementById('kZhi').textContent  = CARDS.filter(function(c){ return c.type === '知识点'; }).length;
  document.getElementById('kSilu').textContent = CARDS.filter(function(c){ return c.type === '思路'; }).length;

  spy();
}

function buildNav(groups){
  var cats = document.getElementById('catNav');
  var list = [{name:'全部', key:'', n:CARDS.length}].concat(ORDER.map(function(t){
    return {name:t, key:t, n:CARDS.filter(function(c){ return c.type === t; }).length};
  }));
  cats.innerHTML = list.map(function(x){
    return '<button type="button" data-cat="'+x.key+'"'+(x.key === cat ? ' class="on"' : '')+'>'
      + (x.key ? '<i class="dot '+DOT[x.key]+'"></i>' : '')
      + '<span class="nm">'+x.name+'</span><span class="ct">'+x.n+'</span></button>';
  }).join('');

  var tp = document.getElementById('topicNav');
  var i = 0, out = '';
  groups.forEach(function(g){
    g.topics.forEach(function(t){
      out += '<a href="#t'+(i++)+'"><span class="nm">'+esc(t.name)+'</span><span class="ct">'+t.cards.length+'</span></a>';
    });
  });
  tp.innerHTML = out || '<span style="padding:6px 8px;font-size:12px;color:var(--text-3)">—</span>';
}

/* 滚动时高亮左侧小类 */
var ticking = false;
function spy(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    ticking = false;
    var heads = [].slice.call(document.querySelectorAll('.rv-topic-h'));
    if(!heads.length) return;
    var cur = null, top = 90;
    heads.forEach(function(h){
      if(h.getBoundingClientRect().top <= top) cur = h.id;
    });
    if(!cur) cur = heads[0].id;
    [].forEach.call(document.querySelectorAll('#topicNav a'), function(a){
      a.classList.toggle('on', a.getAttribute('href') === '#' + cur);
    });
    var active = document.querySelector('#topicNav a.on');
    if(active && active.offsetTop < document.querySelector('.rv-side').scrollTop) {
      document.querySelector('.rv-side').scrollTop = active.offsetTop - 60;
    }
  });
}
window.addEventListener('scroll', spy, { passive:true });
window.addEventListener('resize', spy);

document.getElementById('catNav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-cat]');
  if(!b) return;
  cat = b.getAttribute('data-cat');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('q').addEventListener('input', function(e){ q = e.target.value.trim(); render(); });

/* 主题 */
document.getElementById('themeBtn').addEventListener('click', function(){
  var root = document.documentElement;
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  root.setAttribute('data-mode', next);
  try { localStorage.setItem('cw.theme', JSON.stringify(next)); } catch(err){}
  syncIcon();
});
function syncIcon(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var ico = document.getElementById('themeIco');
  if(ico) ico.innerHTML = '<use href="'+(dark ? '#i-sun' : '#i-moon')+'"/>';
}

/* 背景：跟算法站共用 acm.wall */
function initBg(){
  var DEF = {p:'none',img:'',blur:0,op:100,dim:0}, st = {};
  try { st = JSON.parse(localStorage.getItem('acm.wall') || 'null') || {}; } catch(e){ st = {}; }
  for (var k in DEF) if (typeof st[k] === 'undefined') st[k] = DEF[k];
  var bg = document.getElementById('bg'), dim = document.getElementById('bgDim');
  var custom = !!st.img;
  document.documentElement.setAttribute('data-wall', custom ? 'custom' : (st.p || 'none'));
  bg.style.backgroundImage = custom ? 'url("' + st.img + '")' : '';
  bg.setAttribute('data-p', custom ? '' : (st.p || 'none'));
  bg.style.filter  = st.blur ? 'blur(' + st.blur + 'px)' : 'none';
  bg.style.opacity = String(st.op / 100);

  /* 压暗：有背景时至少压 35%，再叠加用户在算法站设的 dim，保证字看得清 */
  var onBg = custom || (st.p && st.p !== 'none');
  var a = onBg ? Math.max(0.35, st.dim / 100) : (st.dim / 100);
  dim.style.background = a > 0 ? 'rgba(0,0,0,' + a.toFixed(3) + ')' : 'transparent';
  document.body.classList.toggle('has-bg', onBg);
}
window.addEventListener('storage', function(e){ if(e.key === 'acm.wall') initBg(); });

syncIcon();
initBg();
render();
})();
</script>
